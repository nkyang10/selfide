<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Self* Engine Dashboard</title>
<style>
:root{
  --bg:#0d1117;--panel:#161b22;--panel2:#1c2128;--border:#30363d;
  --text:#e6edf3;--muted:#8b949e;--acc:#58a6ff;--ok:#3fb950;--warn:#d29922;
  --bad:#f85149;--dim:#6e7681;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
a{color:var(--acc);text-decoration:none}
a:hover{text-decoration:underline}
code,.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:14px;
  padding:10px 16px;background:#010409;border-bottom:1px solid var(--border)}
header h1{font-size:16px;margin:0;font-weight:600}
#status{display:inline-flex;align-items:center;gap:6px;font-size:12px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--dim)}
.dot.live{background:var(--ok);animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
#lastupd{margin-left:auto;color:var(--muted);font-size:12px}
.layout{display:flex;height:calc(100vh - 47px)}
nav{width:320px;min-width:320px;overflow-y:auto;border-right:1px solid var(--border);
  background:var(--panel);padding:10px;display:flex;flex-direction:column}
nav h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:6px 8px}
#runs{overflow-y:auto;flex:1}
.run{cursor:pointer;padding:8px 10px;border-radius:6px;border:1px solid transparent;margin-bottom:4px}
.run:hover{background:var(--panel2)}
.run.active{background:var(--panel2);border-color:var(--border)}
.run .rid{font-weight:600;font-size:13px}
.run .sub{color:var(--muted);font-size:11.5px;margin-top:2px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.run .cyc{margin-left:auto}
main{flex:1;overflow-y:auto;padding:18px 22px}
.section{background:var(--panel);border:1px solid var(--border);border-radius:8px;margin-bottom:16px;padding:14px 16px}
.section h3{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
@media(max-width:1100px){.g2,.g3{grid-template-columns:1fr}}
.kv{display:grid;grid-template-columns:140px 1fr;row-gap:4px;column-gap:12px;font-size:13px}
.kv .k{color:var(--muted)}
.kv .v{word-break:break-word}
.pill{display:inline-block;padding:1px 9px;border-radius:10px;font-size:11.5px;font-weight:600;border:1px solid var(--border);white-space:nowrap}
.pill.ok{color:var(--ok);border-color:var(--ok)}
.pill.bad{color:var(--bad);border-color:var(--bad)}
.pill.warn{color:var(--warn);border-color:var(--warn)}
.pill.mut{color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--border);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em}
tr:hover td{background:rgba(88,166,255,.04)}
.c-ok{color:var(--ok)}.c-bad{color:var(--bad)}.c-warn{color:var(--warn)}.c-mut{color:var(--muted)}
.timeline{display:flex;gap:10px;flex-wrap:wrap}
.stop{flex:1 1 160px;background:var(--panel2);border:1px solid var(--border);border-radius:6px;padding:8px 10px;border-top:3px solid var(--dim)}
.stop[data-ok="true"]{border-top-color:var(--ok)}
.stop[data-ok="false"]{border-top-color:var(--bad)}
.stop .name{font-weight:600;font-size:12.5px}
.stop .note{color:var(--muted);font-size:11.5px;margin-top:3px}
.stop .times{color:var(--dim);font-size:11px;margin-top:4px}
pre.tail{background:#010409;border:1px solid var(--border);border-radius:6px;padding:10px;overflow:auto;
  max-height:340px;font-size:11.5px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
pre.doc{white-space:pre-wrap;word-break:break-word;background:#0a0e14;border:1px solid var(--border);
  border-radius:6px;padding:12px;font-size:12.5px;max-height:480px;overflow:auto}
input[type=search]{width:100%;padding:7px 10px;border-radius:6px;border:1px solid var(--border);
  background:var(--panel2);color:var(--text);font-size:12.5px;margin-bottom:10px;flex-shrink:0}
.empty{color:var(--dim);font-size:12.5px;padding:8px 2px}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.sum .card{background:var(--panel2);border:1px solid var(--border);border-radius:6px;padding:10px}
.sum .card .num{font-size:22px;font-weight:700}
.sum .card .lbl{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em;margin-top:2px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{background:var(--panel2);border:1px solid var(--border);color:var(--muted);padding:6px 12px;
  border-radius:6px;cursor:pointer;font-size:12.5px}
.tabs button.active{color:var(--text);border-color:var(--acc)}
.docs-nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.timerrow{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px}
.autorefresh{display:flex;align-items:center;gap:6px}
</style>
</head>
<body>
<header>
  <h1>Self* Engine</h1>
  <span id="status"><span class="dot"></span><span id="statusText">&hellip;</span></span>
  <span class="autorefresh"><input type="checkbox" id="ar" checked> auto-refresh 3s</span>
  <span id="lastupd"></span>
</header>
<div class="layout">
  <nav>
    <h2>Runs</h2>
    <input type="search" id="q" placeholder="filter run id / repo…">
    <div id="runs"></div>
  </nav>
  <main id="main"><p class="empty">Select a run on the left.</p></main>
</div>
<script>
const $=s=>document.querySelector(s);
let RUNS=[],CUR=null,FILTER="";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=t=>t?String(t).replace("T"," "):"—";
async function j(url){const r=await fetch(url);if(!r.ok)throw new Error(r.status+" "+r.statusText);return r.json()}
let timer=null;
function stopPoll(){if(timer){clearTimeout(timer);timer=null}}
function schedulePoll(){
  stopPoll();
  timer=setTimeout(async()=>{
    if(!CUR)return;
    if(!$("#ar").checked){schedulePoll();return}
    try{const d=await j("/api/runs/"+encodeURIComponent(CUR));render(d);setStatus(true)}
    catch(e){setStatus(false);console.warn(e)}
    schedulePoll();
  },3000);
}
function setStatus(live){
  $("#statusText").textContent=live?"LIVE":"offline";
  $(".dot").className="dot"+(live?" live":"");
  $("#lastupd").textContent=new Date().toLocaleTimeString();
}
function drawRuns(){
  const f=FILTER.toLowerCase();
  const el=$("#runs");el.innerHTML="";
  RUNS.filter(r=>!f||r.id.toLowerCase().includes(f)||(r.repo||"").toLowerCase().includes(f)).forEach(r=>{
    const d=document.createElement("div");
    const sCls = /fail|error|no-done|stale/.test(r.status||"")?" bad":(/(done|ok|good|shipped|complete)/.test(r.status||"")?" ok":" warn");
    d.className="run"+(r.id===CUR?" active":"");
    d.innerHTML=`<div class="rid">${esc(r.id)}</div>
      <div class="sub"><span class="pill${sCls}">${esc(r.status||"—")}</span><span class="cyc">cyc ${esc(r.cycle||"—")}</span></div>
      <div class="sub"><span>${esc(r.repo||"")}</span></div>`;
    d.onclick=()=>{CUR=r.id;drawRuns();loadRun()};
    el.appendChild(d);
  });
}
async function loadRun(){
  setStatus(false);$("#statusText").textContent="loading…";stopPoll();
  try{const d=await j("/api/runs/"+encodeURIComponent(CUR));render(d);setStatus(true);drawRuns()}
  catch(e){$("#main").innerHTML=`<p class="empty">Error loading run: ${esc(e)}</p>`;setStatus(false)}
  schedulePoll();
}
function render(d){
  if(!d.id){$("#main").innerHTML=`<p class="empty">empty run</p>`;return}
  const m=d.meta||{};
  const phases=(d.phases||[]);
  const workers=(d.workers||[]);
  const states=d.states||{};
  $("#lastupd").textContent=new Date().toLocaleTimeString();
  let h="";

  // — meta block —
  const sCls=m.good?" ok":(/fail|error|no-done/.test(m.status||"")?" bad":" warn");
  h+=`<div class="section">
    <div class="grid g3">
      <div class="kv">
        <span class="k">Run</span><span class="v">${esc(m.run_id||d.id)}</span>
        <span class="k">Repo</span><span class="v">${esc(m.repo||"—")}</span>
        <span class="k">Created</span><span class="v">${fmt(m.created)}</span>
      </div>
      <div class="kv">
        <span class="k">Cycle</span><span class="v">${esc(m.cycle||"—")}</span>
        <span class="k">Round</span><span class="v">${esc(m.round??"—")}/${esc(m.max_round??"—")}</span>
        <span class="k">Issue</span><span class="v">${esc(m.issue??"—")}</span>
      </div>
      <div class="kv">
        <span class="k">Status</span><span class="v"><span class="pill${sCls}">${esc(m.status||"—")}</span></span>
      </div>
    </div>
    <h3 style="margin-top:14px">Work</h3><div style="color:var(--muted);font-size:13px">${esc(m.work||"—")}</div>`;
  if(m.targets&&m.targets.length){
    h+=`<h3 style="margin-top:14px">Targets (${m.targets.length})</h3>
      <div style="line-height:2">${m.targets.map(t=>`<span class="pill mut" style="margin-right:6px">${esc(t)}</span>`).join("")}</div>`;
  }
  h+=`</div>`;

  // — summary cards —
  const doneW=workers.filter(w=>w.status==="done").length;
  const halfW=workers.filter(w=>w.status==="half").length;
  const failW=workers.filter(w=>w.status==="failed").length;
  const failP=phases.filter(p=>p.ok===false).length;
  h+=`<div class="section"><div class="sum">
    <div class="card"><div class="num" style="color:var(--ok)">${doneW}</div><div class="lbl">tasks done</div></div>
    <div class="card"><div class="num" style="color:var(--warn)">${halfW}</div><div class="lbl">tasks half</div></div>
    <div class="card"><div class="num" style="color:var(--bad)">${failW}</div><div class="lbl">tasks failed</div></div>
    <div class="card"><div class="num ${failP?"c-bad":""}">${failP}</div><div class="lbl">failed phases</div></div>
    <div class="card"><div class="num">${phases.length}</div><div class="lbl">phase records</div></div>
    <div class="card"><div class="num">${Object.keys(d.agent_logs||{}).length}</div><div class="lbl">agent logs</div></div>
    <div class="card"><div class="num">${Object.keys(d.next_cycles||{}).length}</div><div class="lbl">next-cycle docs</div></div>
  </div></div>`;

  // — phases by cycle (grouped) —
  const byCycle={};
  phases.forEach(p=>{(byCycle[p._cycle]=byCycle[p._cycle]||[]).push(p)});
  h+=`<div class="section"><h3>Phase timeline</h3>`;
  if(!phases.length)h+=`<div class="empty">no phase records yet</div>`;
  Object.keys(byCycle).sort((a,b)=>a.localeCompare(b,undefined,{numeric:true})).forEach(cyc=>{
    h+=`<div class="timerow" style="margin:10px 0 6px"><b>cycle ${esc(cyc)}</b></div><div class="timeline">`;
    byCycle[cyc].forEach(p=>{
      const cls=p.ok===true?"ok":(p.ok===false?"bad":"warn");
      h+=`<div class="stop" data-ok="${p.ok}"><div class="name"><span class="pill ${cls}">${esc(p.phase)}</span></div>
        <div class="note">${esc(p.note||"")}</div>
        <div class="times">${fmt(p.start)} &rarr; ${fmt(p.end)}</div></div>`;
    });
    h+=`</div>`;
  });
  h+=`</div>`;

  // — workers/tasks table (collapse by branch, last record wins) —
  h+=`<div class="section"><h3>Engineer tasks by cycle</h3>`;
  const byBt={};
  workers.forEach(w=>{byBt[w._cycle]=byBt[w._cycle]||{};byBt[w._cycle][w.branch]=w});
  if(!workers.length)h+=`<div class="empty">no worker records yet</div>`;
  Object.keys(byBt).sort((a,b)=>a.localeCompare(b,undefined,{numeric:true})).forEach(cyc=>{
    const list=Object.values(byBt[cyc]).sort((a,b)=>(a.worker||0)-(b.worker||0));
    h+=`<div class="timerow" style="margin:12px 0 6px"><b>cycle ${esc(cyc)}</b> &mdash; ${list.length} task${list.length===1?"":"s"}</div>`;
    h+=`<table><thead><tr><th>#</th><th>Status</th><th>Task</th><th>Branch</th><th>Cmts</th><th>Exit</th><th>Run time</th></tr></thead><tbody>`;
    list.forEach(w=>{
      const cls=w.status==="done"?"ok":(w.status==="half"?"warn":"bad");
      const running=w.status==="half"&&!w.end;
      h+=`<tr><td>${esc(w.worker||w.task)}</td>
        <td><span class="pill ${cls}">${running?"running&hellip;":esc(w.status)}</span></td>
        <td>${esc(w.task)}</td><td class="m">${esc(w.branch||"")}</td>
        <td>${esc(w.commits??"—")}</td><td>${esc(w.exit??"—")}</td>
        <td class="m">${fmt(w.start)} &rarr; ${fmt(w.end)}</td></tr>`;
    });
    h+=`</tbody></table>`;
  });
  h+=`</div>`;

  // — states timeline (per cycle current phase state) —
  const sk=Object.keys(states);
  if(sk.length){
    h+=`<div class="section"><h3>Per-cycle state</h3><table><thead><tr><th>Cycle</th><th>Role</th><th>Status</th><th>Note</th><th>Time</th></tr></thead><tbody>`;
    sk.sort((a,b)=>a.localeCompare(b,undefined,{numeric:true})).forEach(cyc=>{
      const st=states[cyc]||{};
      Object.entries(st).forEach(([role,v])=>{
        const cls=v.status==="done"?"ok":(v.status==="failed"?"bad":"warn");
        h+=`<tr><td>${esc(cyc)}</td><td>${esc(role)}</td>
          <td><span class="pill ${cls}">${esc(v.status)}</span></td>
          <td>${esc(v.note||"")}</td><td class="m">${fmt(v.start)} &rarr; ${fmt(v.end)}</td></tr>`;
      });
    });
    h+=`</tbody></table></div>`;
  }

  // — agent logs —
  const logs=d.agent_logs||{};
  const lnames=Object.keys(logs).sort();
  if(lnames.length){
    h+=`<div class="section"><h3>Agent logs (tail)</h3><div class="tabs">`;
    lnames.forEach((n,i)=>h+=`<button data-tab="${esc(n)}" class="${i===0?"active":""}">${esc(n.replace(/agent-/,"").replace(/\.log$/,""))}</button>`);
    h+=`</div>`;
    lnames.forEach((n,i)=>{
      h+=`<pre class="tail" data-panel="${esc(n)}" ${i===0?"":`hidden`}>${esc(logs[n])}</pre>`;
    });
    h+=`</div>`;
  }

  // — plan —
  if(d.plan)h+=`<div class="section"><h3>Plan</h3><pre class="doc">${esc(d.plan)}</pre></div>`;

  // — next-cycle docs —
  const nc=d.next_cycles||{};
  const nk=Object.keys(nc).sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
  if(nk.length){
    h+=`<div class="section"><h3>Next-cycle docs</h3><div class="docs-nav">`;
    nk.forEach(k=>h+=`<button class="tab" data-nc="${esc(k)}">next-cycle-${esc(k)}</button>`);
    h+=`</div>`;
    nk.forEach(k=>h+=`<pre class="doc" data-ncpanel="${esc(k)}" hidden>${esc(nc[k])}</pre>`);
    h+=`</div>`;
  }

  // — trail —
  if(d.trail)h+=`<div class="section"><h3>Trail</h3><pre class="doc">${esc(d.trail)}</pre></div>`;

  // — reports + handoff + interview —
  const rp=d.reports||{};
  const rk=Object.keys(rp).sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
  if(rk.length||d.handoff||d.interview){
    h+=`<div class="section"><h3>Docs</h3><div class="docs-nav">`;
    if(d.handoff)h+=`<button class="tab" data-doc="handoff">handoff</button>`;
    if(d.interview)h+=`<button class="tab" data-doc="interview">interview</button>`;
    rk.forEach(k=>h+=`<button class="tab" data-doc="report-${esc(k)}">report-${esc(k)}</button>`);
    h+=`</div>`;
    if(d.handoff)h+=`<pre class="doc" data-docpanel="handoff" hidden>${esc(d.handoff)}</pre>`;
    if(d.interview)h+=`<pre class="doc" data-docpanel="interview" hidden>${esc(d.interview)}</pre>`;
    rk.forEach(k=>h+=`<pre class="doc" data-docpanel="report-${esc(k)}" hidden>${esc(rp[k])}</pre>`);
    h+=`</div>`;
  }

  // — files —
  if(d._files&&d._files.length){
    h+=`<div class="section"><h3>Run files</h3><div style="display:flex;flex-wrap:wrap;gap:6px">`;
    d._files.forEach(f=>h+=`<span class="pill mut">${esc(f)}</span>`);
    h+=`</div></div>`;
  }

  $("#main").innerHTML=h;
  // — wire tabs (delegate) —
  $("#main").onclick=e=>{
    const t=e.target.closest("[data-tab]");
    if(t){
      const name=t.dataset.tab;
      t.parentElement.querySelectorAll("[data-tab]").forEach(b=>b.classList.toggle("active",b===t));
      t.parentElement.parentElement.querySelectorAll("[data-panel]").forEach(p=>p.hidden=(p.dataset.panel!==name));
      return;
    }
    const n=t?null:e.target.closest("[data-nc]");
    if(n){
      const k=n.dataset.nc;
      n.parentElement.querySelectorAll("[data-nc]").forEach(b=>b.classList.toggle("active",b===n));
      n.parentElement.parentElement.querySelectorAll("[data-ncpanel]").forEach(p=>p.hidden=(p.dataset.ncpanel!==k));
      return;
    }
    const dd=e.target.closest("[data-doc]");
    if(dd){
      const k=dd.dataset.doc;
      dd.parentElement.querySelectorAll("[data-doc]").forEach(b=>b.classList.toggle("active",b===dd));
      dd.parentElement.parentElement.querySelectorAll("[data-docpanel]").forEach(p=>p.hidden=(p.dataset.docpanel!==k));
    }
  };
}

// boot
$("#q").addEventListener("input",e=>{FILTER=e.target.value.trim();drawRuns()});
(async function boot(){
  try{const d=await j("/api/runs");RUNS=d.runs}
  catch(e){$("#runs").innerHTML=`<p class="empty">cannot reach /api/runs: ${esc(e)}</p>`;return}
  drawRuns();
  if(RUNS.length){CUR=RUNS[0].id;drawRuns();loadRun()}
})();
</script>
</body>
</html>
