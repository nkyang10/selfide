<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KNOWLEDGE/ — product wiki prototype</title>
<style>
:root{--bg:#0d1117;--panel:#161b22;--panel2:#1c2128;--border:#30363d;
  --text:#e6edf3;--muted:#8b949e;--acc:#58a6ff;--ok:#3fb950;--warn:#d29922;
  --bad:#f85149;--dim:#6e7681;--hl:#1f6feb33}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
a{color:var(--acc);text-decoration:none}a:hover{text-decoration:underline}
code,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px}
.muted{color:var(--muted)}.dim{color:var(--dim)}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;padding:10px 18px;
  background:#010409;border-bottom:1px solid var(--border)}
header .brand{display:flex;align-items:baseline;gap:8px}
header .brand b{font-size:15px}
header .brand .path{color:var(--muted);font-size:12.5px;font-family:ui-monospace,monospace}
header .crumbs{color:var(--muted);font-size:13px;display:flex;gap:6px;align-items:center}
#searchbox{margin-left:auto;width:250px;padding:6px 10px;border-radius:6px;border:1px solid var(--border);
  background:var(--panel2);color:var(--text);font-size:13px}
.layout{display:flex;height:calc(100vh - 51px)}
nav{width:300px;min-width:300px;overflow-y:auto;border-right:1px solid var(--border);background:var(--panel);padding:12px}
nav .grp{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin:14px 6px 6px}
nav .leaf{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:6px;cursor:pointer;font-size:13px;color:var(--text)}
nav .leaf:hover{background:var(--panel2)}
nav .leaf.active{background:var(--hl);border-left:3px solid var(--acc)}
nav .leaf .ic{color:var(--muted);width:18px;text-align:center}
nav .leaf .n{font-weight:600;font-size:12px;border-radius:8px;padding:0 7px;background:var(--panel2);color:var(--muted);margin-left:auto}
main{flex:1;overflow-y:auto;padding:22px 30px;max-width:980px}
h1.title{font-size:24px;margin:0 0 4px}
h2{font-size:18px;margin:26px 0 8px;border-bottom:1px solid var(--border);padding-bottom:6px}
h3{font-size:15px;margin:18px 0 6px}
.meta{color:var(--muted);font-size:12.5px;margin-bottom:18px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:14px 16px;margin:12px 0}
.card h4{margin:0 0 8px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.callout{border-left:3px solid var(--acc);background:var(--panel);padding:10px 14px;border-radius:0 6px 6px 0;margin:12px 0}
.callout.warn{border-color:var(--warn)}.callout.bad{border-color:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:13px;margin:10px 0}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--border);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em}
.pill{display:inline-block;padding:1px 9px;border-radius:10px;font-size:11px;font-weight:600;border:1px solid var(--border);white-space:nowrap}
.pill.ok{color:var(--ok);border-color:var(--ok)}.pill.warn{color:var(--warn);border-color:var(--warn)}
.pill.bad{color:var(--bad);border-color:var(--bad)}.pill.mut{color:var(--muted)}.pill.acc{color:var(--acc);border-color:var(--acc)}
.srclist{list-style:none;padding:0;margin:8px 0}
.srclist li{padding:3px 0;font-size:12.5px;border-bottom:1px dashed var(--border)}
.srclist li .tag{color:var(--dim);font-size:11px;margin-right:8px}
.updatelist{list-style:none;padding:0;margin:8px 0}
.updatelist li{display:flex;gap:10px;padding:7px 0;border-bottom:1px dashed var(--border);font-size:13px}
.updatelist .cyc{color:var(--acc);font-family:ui-monospace,monospace;font-size:12px;flex-shrink:0}
.finding{background:var(--panel2);border:1px solid var(--border);border-radius:6px;padding:10px 12px;margin:10px 0}
.finding .kf{font-weight:600;color:var(--acc)}
.finding .src{margin-top:6px;color:var(--dim);font-size:12px}
.breadcrumb{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:12.5px;margin-bottom:4px}
.recent{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:12px 14px}
.kv{display:grid;grid-template-columns:150px 1fr;gap:4px 12px;font-size:13px}.kv .k{color:var(--muted)}
ul{line-height:1.7;padding-left:22px}
#searchbox::placeholder{color:var(--dim)}
</style>
</head>
<body>
<header>
  <div class="brand"><b>KNOWLEDGE.</b><span class="path">/ engine-managed product wiki</span></div>
  <div class="crumbs"><span id="crumbs">Home</span></div>
  <input id="searchbox" placeholder="search topics…  (try: coupon, sqlite, scanner)">
</header>
<div class="layout">
  <nav id="tree"></nav>
  <main id="main"></main>
</div>
<script src="kb-data.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let CUR=null, LASTUPD=[];
const TREE=[["Products","cloud-pos","📦"],["Cross-cutting","concurrency-sqlite","⚙️"],["Cross-cutting","barcode-qr-scanning","🔤"],["Engine","engine-sub-cycle-flow","🤖"]];
function href(p){return KNOWLEDGE[p]?"#/"+p:"#"}
function drawTree(){
  const nav=$("#tree");nav.innerHTML="";
  TREE.forEach(([grp,key,ic])=>{
    if(!KNOWLEDGE[key])return;
    if(!nav.querySelector(`.grp[data-g="${grp}"]`)){
      const g=document.createElement("div");g.className="grp";g.dataset.g=grp;g.textContent=grp;nav.appendChild(g);
    }
    const leaf=document.createElement("div");leaf.className="leaf"+(CUR===key?" active":"");
    const k=KNOWLEDGE[key];
    leaf.innerHTML=`<span class="ic">${ic}</span><span>${esc(k.title)}</span><span class="n">${k.pages?Object.keys(k.pages).length:0}</span>`;
    leaf.onclick=()=>{CUR=key;drawTree();drawPage();showBreadcrumb(key)};
    nav.appendChild(leaf);
  });
}
function showBreadcrumb(key){
  $("#crumbs").innerHTML=`<span>KNOWLEDGE</span><span>/</span><span>${esc(KNOWLEDGE[key].title)}</span>`;
}
function pageBody(k){
  const p=KNOWLEDGE[k];
  let h=`<h1 class="title">${esc(p.title)}</h1>
    <div class="meta">${esc(p.desc||"")}</div>`;
  // TL;DR block
  h+=`<div class="card" style="border-left:3px solid var(--acc)"><h4>TL;DR</h4><p style="margin:0">${esc(p.tldr||p.summary||"")}</p></div>`;
  if(p.facts){h+=`<h2>Key facts</h2><div class="card"><div class="kv">`;p.facts.forEach(([k,v])=>h+=`<span class="k">${esc(k)}</span><span>${esc(v)}</span>`);h+=`</div></div>`;}
  // prose: why & how
  if(p.prose){h+=`<h2>Why &amp; how</h2><div class="card" style="color:var(--muted)"><p style="margin:0">${esc(p.prose)}</p></div>`;}
  if(p.findings){h+=`<h2>Findings</h2>`;p.findings.forEach(f=>{
    h+=`<div class="finding"><span class="kf">${esc(f.kf)}</span><p>${esc(f.body)}</p><div class="src">↳ ${esc(f.src||"")}</div></div>`;
  });}
  if(p.sources){h+=`<h2>Sources</h2><div class="card"><ul class="srclist">`;
    p.sources.forEach((s,i)=>h+=`<li><span class="tag">[src]</span><a href="${esc(s)}" target="_blank">${esc(s)}</a></li>`);h+=`</ul></div>`;}
  if(p.related){h+=`<h2>Related</h2><div class="card">`;p.related.forEach(r=>{
    const rk=r.split("/").pop().replace(/\.md$/,"");
    h+=`<a href="#/${esc(rk)}">${esc(r)}</a> · `;});h+=`</div>`;}
  return h;
}
function indexBody(k){
  const p=KNOWLEDGE[k];
  let h=`<h1 class="title">${esc(p.title)} — Overview</h1><div class="meta">${esc(p.desc||"")}</div>
    <div class="card"><p>${esc(p.summary)}</p></div>`;
  h+=`<h2>Product pages</h2><div class="card">`;
  Object.entries(KNOWLEDGE).forEach(([key,prod])=>{
    if(key==="index")return;
    h+=`<h3 style="margin-top:10px">📦 ${esc(prod.title)}</h3><table><thead><tr><th>Topic</th><th>TL;DR</th></tr></thead><tbody>`;
    Object.entries(prod.pages||{}).forEach(([pg,page])=>{
      if(pg==="index"){h+=`<tr><td><a href="#/${esc(key)}/index">Overview</a></td><td>${esc(page.summary)}</td></tr>`;return;}
      h+=`<tr><td><a href="#/${esc(key)}/${esc(pg)}">${esc(page.title)}</a></td><td>${esc(page.summary)}</td></tr>`;
    });
    h+=`</tbody></table>`;
  });
  h+=`</div><h2>Latest updates</h2><div class="recent"><ul class="updatelist">`;
  LASTUPD.forEach(u=>h+=`<li><span class="cyc">${u.cyc}</span><span>${u.msg}</span></li>`);
  h+=`</ul></div>`;
  return h;
}
function drawPage(){
  const k=CUR||"index";
  let h="";
  if(k==="index")h=indexBody(k);
  else{
    h+=`<div class="breadcrumb"><a href="#/index">all products</a> / <span>${esc(KNOWLEDGE[k].title)}</span></div>`;
    h+=pageBody(k);
  }
  $("#main").innerHTML=h;
}
function routeKey(hash){
  const parts=hash.replace(/^#\/?/,"").split("/").filter(Boolean);
  if(parts.length===0)return "index";
  return parts[0];
}
function doSearch(q){
  const s=q.toLowerCase();
  const hits=[];const seen=new Set();
  const scan=(obj,path)=>{
    for(const [key,val] of Object.entries(obj)){
      const label=(val.title||val.kf||key||"");
      if(s&&label.toLowerCase().includes(s)&&!seen.has(path+"/"+key)){seen.add(path+"/"+key);hits.push({path:path+"/"+key,title:label,summary:val.summary||val.body||""})}
      if(val.pages)scan(val.pages,path+"/"+key);
      else if(val.findings)val.findings.forEach((f,i)=>{if((f.kf+(f.body||"")).toLowerCase().includes(s)&&!seen.has(path+"/"+key+"#"+i)){seen.add(path+"/"+key+"#"+i);hits.push({path:path+"/"+key,title:f.kf,summary:f.body})}});
    }
  };
  scan(KNOWLEDGE,"");
  let h=`<h1 class="title">Search: “${esc(q)}”</h1>`;
  if(!hits.length)h+=`<div class="card"><p class="muted">No matches.</p></div>`;
  else{h+=`<div class="card"><table><thead><tr><th>Page</th><th>Match</th></tr></thead><tbody>`;
    hits.slice(0,30).forEach(ht=>{const key=ht.path.split("/")[0];h+=`<tr><td><a href="#/${esc(ht.path)}">${esc(ht.title)}</a></td><td>${esc(ht.summary.slice(0,120))}</td></tr>`});
    h+=`</tbody></table></div>`;}
  $("#main").innerHTML=h;
}
function showBreadcrumb(k){}
window.addEventListener("hashchange",()=>{const k=routeKey(location.hash);const s=$("#searchbox").value;
  if(s)doSearch(s);else{CUR=k;drawTree();drawPage();}});
$("#searchbox").addEventListener("input",e=>{const s=e.target.value.trim();if(s)doSearch(s);else{CUR=routeKey(location.hash);drawPage();}});
// boot
(function(){CUR=routeKey(location.hash);drawTree();drawPage();})();
</script>
</body>
</html>
